name: Run ClariSafe Evaluations

on:
  workflow_dispatch:
  push:
    paths:
      - "evaluations/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/run-evaluations.yml"

jobs:
  summarize:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run validation tests
        run: python -m unittest discover -s tests -v

      - name: Summarize evaluations
        run: python scripts/summarize_evaluations.py
